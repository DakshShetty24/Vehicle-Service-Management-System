<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Create Service Bill - Vehicle Service Management System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #212529;
            color: white;
            padding: 15px 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .info {
            background: #e9f7ef;
            color: #146c43;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: #198754;
        }

        .cancel {
            background: #6c757d;
            text-decoration: none;
            color: white;
            text-align: center;
            padding: 11px;
            border-radius: 5px;
            flex: 1;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>Vehicle Service Management System</h2>

</div>


<div class="container">

    <div class="card">

        <h2>Create Service Bill</h2>

        <div class="info">

            Bills can only be created for completed
            service bookings.

        </div>


        <div
            th:if="${#lists.isEmpty(bookings)}"
            class="empty">

            No completed service bookings are available
            for billing.

        </div>


        <form
            th:if="${!#lists.isEmpty(bookings)}"
            action="/admin/bill/create"
            method="post">


            <label>Select Completed Booking</label>

            <select
                name="bookingId"
                required>

                <option value="">
                    Select Booking
                </option>

                <option
                    th:each="booking : ${bookings}"
                    th:value="${booking.id}"
                    th:text="${'Booking #' + booking.id + ' - ' + booking.vehicle.vehicleNumber + ' - ' + booking.serviceType}">

                </option>

            </select>


            <label>Service Charge</label>

            <input
                type="number"
                name="serviceCharge"
                placeholder="Enter service charge"
                min="0"
                step="0.01"
                required>


            <label>Parts Charge</label>

            <input
                type="number"
                name="partsCharge"
                placeholder="Enter parts charge"
                min="0"
                step="0.01"
                required>


            <div class="buttons">

                <button
                    type="submit"
                    class="save">

                    Create Bill

                </button>


                <a
                    href="/admin/dashboard"
                    class="cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>

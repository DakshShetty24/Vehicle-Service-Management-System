<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Spare Part - Vehicle Service Management System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #212529;
            color: white;
            padding: 15px 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: #198754;
        }

        .cancel {
            background: #6c757d;
            text-decoration: none;
            color: white;
            text-align: center;
            padding: 11px;
            border-radius: 5px;
            flex: 1;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>Vehicle Service Management System</h2>

</div>

<div class="container">

    <div class="card">

        <h2>Add Spare Part</h2>

        <form
            action="/admin/parts/save"
            method="post">

            <label>Part Name</label>

            <input
                type="text"
                name="partName"
                placeholder="Enter part name"
                required>


            <label>Price</label>

            <input
                type="number"
                name="price"
                placeholder="Enter price"
                min="0"
                step="0.01"
                required>


            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                placeholder="Enter quantity"
                min="0"
                required>


            <div class="buttons">

                <button
                    type="submit"
                    class="save">

                    Save Part

                </button>

                <a
                    href="/admin/dashboard"
                    class="cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
